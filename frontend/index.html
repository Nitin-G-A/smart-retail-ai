<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Retail AI – Mall Shop Finder</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <h1>Smart Retail AI</h1>
        <p>Find the right shop in the mall for your budget.</p>
    </div>
</header>

<main class="container">

    <!-- Tells the user (and you) whether data is demo or live. Filled in by app.js -->
    <div id="mode-banner" class="mode-banner" role="status"></div>

    <section class="panel" aria-labelledby="search-title">
        <h2 id="search-title">What are you looking for?</h2>

        <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-form" class="tab active"
                    aria-selected="true" aria-controls="form-search">Budget &amp; category</button>
            <button type="button" role="tab" id="tab-nl" class="tab"
                    aria-selected="false" aria-controls="form-nl">Describe it</button>
        </div>

        <!-- Option 1: form search -->
        <form id="form-search" class="search-form" role="tabpanel" aria-labelledby="tab-form" novalidate>
            <div class="field">
                <label for="budget">Shopping budget (₹)</label>
                <input type="number" id="budget" name="budget" min="1" step="1"
                       inputmode="numeric" value="1500" aria-describedby="budget-error">
                <p class="field-error" id="budget-error" role="alert"></p>
            </div>

            <div class="field">
                <label for="category">Category</label>
                <select id="category" name="category"></select>
            </div>

            <button type="submit" class="btn primary" id="btn-form-search">Search shops</button>
        </form>

        <!-- Option 2: natural-language search (optional) -->
        <form id="form-nl" class="search-form" role="tabpanel" aria-labelledby="tab-nl" hidden novalidate>
            <div class="field">
                <label for="nl-text">Describe what you need</label>
                <textarea id="nl-text" name="nl-text" rows="3" maxlength="300"
                          placeholder="I want casual clothes for college." aria-describedby="nl-error nl-hint"></textarea>
                <p class="field-error" id="nl-error" role="alert"></p>
                <p class="hint" id="nl-hint"></p>
            </div>

            <button type="submit" class="btn primary" id="btn-nl-search">Search with description</button>
        </form>
    </section>

    <!-- Results area: notice, state (idle/loading/empty/error), header, cards -->
    <section class="results" aria-live="polite" aria-labelledby="results-title">
        <div id="notice" class="notice" hidden></div>

        <div id="state" class="state"></div>

        <div id="results-header" class="results-header" hidden>
            <h2 id="results-title"></h2>
            <span id="source-badge" class="badge"></span>
        </div>

        <div id="results-grid" class="grid"></div>
    </section>

</main>

<footer class="site-footer">
    <div class="container">Smart Retail AI · student portfolio project</div>
</footer>

<!-- Plain scripts (not ES modules) so the page also works when opened via file:// -->
<!-- Order matters: each file uses the one before it. -->
<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
