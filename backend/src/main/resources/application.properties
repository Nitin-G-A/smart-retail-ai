spring.application.name=smart-retail-ai
# Hosts such as Render set PORT; locally it stays 8080.
server.port=${PORT:8080}

# Database. Credentials come from environment variables, never from the code.
# Locally the default below is used. In the cloud set DB_URL (see README, Deployment).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_retail}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The tables are created by database/schema.sql. Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Frontend origins allowed to call the API (comma-separated).
# 5500 = python -m http.server 5500, 63342 = IntelliJ's built-in "open in browser".
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://localhost:63342}

# AI search (Gemini). The key comes ONLY from the LLM_API_KEY environment variable.
# Get a free key at https://aistudio.google.com/apikey . If the model name stops working, pick a current one there.
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=gemini-2.5-flash
app.llm.base-url=https://generativelanguage.googleapis.com/v1beta
